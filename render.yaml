services:
  - type: web
    name: portal-kelas-online
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/portal.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1
